name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Projektordner finden
        id: find
        run: |
          S=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$S" ]; then
            echo "Keine settings.gradle.kts im Repo gefunden"
            ls -R | head -50
            exit 1
          fi
          D=$(dirname "$S")
          echo "Projektordner: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Debug-APK bauen
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: Boris-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
