name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: ZIP entpacken
        run: |
          Z=$(ls *.zip | sort | tail -n 1)
          echo "Entpacke $Z"
          mkdir -p /tmp/proj
          unzip -q "$Z" -d /tmp/proj
          S=$(find /tmp/proj -name settings.gradle.kts | head -n 1)
          if [ -z "$S" ]; then echo "Keine settings.gradle.kts im ZIP"; exit 1; fi
          dirname "$S" > /tmp/projdir
          echo "Projektordner: $(cat /tmp/projdir)"

      - name: Debug-APK bauen
        run: |
          cd "$(cat /tmp/projdir)"
          gradle :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: Boris-APK
          path: /tmp/proj/**/app/build/outputs/apk/debug/app-debug.apk
